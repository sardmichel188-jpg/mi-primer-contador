<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Primera Página Web</title>
    <!-- Vinculamos el archivo CSS externo -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Mi Primera Aplicación Interactiva</h1>
    <p>Aprendiendo lógica con JavaScript</p>

    <!-- El número que va a cambiar -->
    <h2 id="numeroContador" style="font-size: 48px">0</h2>

    <!-- Botones de control -->
    <div>
        <button id="btnRestar" class="mi-boton" style="background-color: #e74c3c;">Restar (-)</button>
        <button id="btnSumar" class="mi-boton">Sumar (+)</button>
        
        <!-- Nuevos botones añadidos -->
        <button id="btnReiniciar" class="mi-boton" style="background-color: #95a5a6;">Reiniciar (0)</button>
        <button id="btnDuplicar" class="mi-boton" style="background-color: #f39c12;">Duplicar (x2)</button>

    <script src="script.js"></script>
</body>
</html>
